<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020409"/>
      <stop offset="50%" style="stop-color:#040d1a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="greenline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="160" fill="url(#bg)"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#00d4ff" stroke-width="0.2" opacity="0.12"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#00d4ff" stroke-width="0.2" opacity="0.12"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#00d4ff" stroke-width="0.2" opacity="0.12"/>
  <line x1="180" y1="0" x2="180" y2="160" stroke="#00d4ff" stroke-width="0.2" opacity="0.08"/>
  <line x1="360" y1="0" x2="360" y2="160" stroke="#00d4ff" stroke-width="0.2" opacity="0.08"/>
  <line x1="540" y1="0" x2="540" y2="160" stroke="#00d4ff" stroke-width="0.2" opacity="0.08"/>
  <line x1="720" y1="0" x2="720" y2="160" stroke="#00d4ff" stroke-width="0.2" opacity="0.08"/>
  <!-- Corner brackets -->
  <path d="M18,14 L18,5 L27,5" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M882,14 L882,5 L873,5" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M18,146 L18,155 L27,155" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M882,146 L882,155 L873,155" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Accent dots -->
  <circle cx="55" cy="80" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="68" cy="66" r="1" fill="#00ff88" opacity="0.4"/>
  <circle cx="42" cy="94" r="1" fill="#00d4ff" opacity="0.3"/>
  <circle cx="845" cy="80" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="832" cy="66" r="1" fill="#00ff88" opacity="0.4"/>
  <circle cx="858" cy="94" r="1" fill="#00d4ff" opacity="0.3"/>
  <!-- Top line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#cyanline)"/>
  <!-- Label -->
  <text x="450" y="40" font-family="Courier New,monospace" font-size="10" fill="#00ff88" text-anchor="middle" opacity="0.85" filter="url(#glow)">// next.js · react · technical-seo · claude-code</text>
  <!-- Name -->
  <text x="450" y="90" font-family="Courier New,monospace" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="5" filter="url(#glow)">MUHAMMAD IDREES</text>
  <!-- Name underline -->
  <rect x="210" y="97" width="480" height="1.5" fill="url(#cyanline)" opacity="0.9"/>
  <!-- Subtitle -->
  <text x="450" y="120" font-family="Courier New,monospace" font-size="11.5" fill="#00d4ff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">NEXT.JS &amp; REACT DEVELOPER  ·  TECHNICAL SEO</text>
  <!-- Location -->
  <text x="450" y="144" font-family="Courier New,monospace" font-size="9.5" fill="#334455" text-anchor="middle" letter-spacing="2">⌖ KARACHI, PK  →  UK · UAE · EU · GLOBAL REMOTE</text>
