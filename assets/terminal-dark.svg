<svg xmlns="http://www.w3.org/2000/svg" width="640" height="306" viewBox="0 0 640 306" role="img" aria-label="Terminal showing whoami for Muhammad Idrees and a WordPress to Next.js migration with every check passing" xml:space="preserve">
<title>Muhammad Idrees, full-stack developer</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
.type { animation-name: type; animation-fill-mode: backwards; }
.caret { opacity: 0; animation-name: show; }
.o { animation: fade .2s ease-out backwards; }
.cursor { animation: hide 1ms backwards, blink 1.1s step-end infinite; }
@keyframes type { from { transform: none; } }
@keyframes show { from, to { opacity: 1; } }
@keyframes hide { from, to { opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .type, .caret, .o, .cursor { animation: none; } }
</style>
<defs><clipPath id="win"><rect width="640" height="306" rx="8"/></clipPath></defs>
<g clip-path="url(#win)">
